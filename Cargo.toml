[package]
name = "spectrum_monitor"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.16", features = ["derive"] }
cpal = "0.15"
env_logger = "0.11"
iced = { version = "0.13", features = ["wgpu", "advanced", "tokio", "debug", "canvas"] }
rustfft = "6.2"


[profile.release]
strip = true  # 自动从二进制文件去除符号信息.
lto = true

